<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="noseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <!-- Background Badge Circle -->
  <circle cx="50" cy="50" r="47" fill="url(#bgGrad)" stroke="#0ea5e9" stroke-width="2.5" />

  <!-- Left Eye Outer Ring -->
  <circle cx="27" cy="40" r="18" fill="url(#ringGrad)" />
  <!-- Left Eye Sclera (White) -->
  <circle cx="27" cy="40" r="13" fill="#ffffff" />
  <!-- Left Eye Pupil -->
  <circle cx="27" cy="40" r="6.5" fill="#0f172a" />
  <!-- Left Eye Glint/Reflection -->
  <circle cx="24.5" cy="37.5" r="2.2" fill="#ffffff" />

  <!-- Right Eye Outer Ring -->
  <circle cx="73" cy="40" r="18" fill="url(#ringGrad)" />
  <!-- Right Eye Sclera (White) -->
  <circle cx="73" cy="40" r="13" fill="#ffffff" />
  <!-- Right Eye Pupil -->
  <circle cx="73" cy="40" r="6.5" fill="#0f172a" />
  <!-- Right Eye Glint/Reflection -->
  <circle cx="70.5" cy="37.5" r="2.2" fill="#ffffff" />

  <!-- Nose (Mount Parnassus Triangle) - Enriched and enlarged by ~60% -->
  <polygon points="50,45 35,68 65,68" fill="url(#noseGrad)" stroke="#0284c7" stroke-width="2" stroke-linejoin="round" />
</svg>
